services:
  - type: web
    name: gairus
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GAIRUS_NAME
        value: Gaïrus
      - key: GAIRUS_AUTONOMY
        value: "true"
      - key: GAIRUS_APPROVALS
        value: "true"
      - key: GAIRUS_LLM_PROVIDER
        value: auto
      - key: GAIRUS_LLM_MODEL
        value: auto
      - key: GAIRUS_ORTA_API_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GOOGLE_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: MISTRAL_API_KEY
        sync: false
      - key: OPENROUTER_API_KEY
        sync: false
      - key: CLOUDFLARE_API_TOKEN
        sync: false
      - key: CLOUDFLARE_ACCOUNT_ID
        sync: false
      - key: ZAI_API_KEY
        sync: false
