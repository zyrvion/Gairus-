services:
  - type: web
    name: gairus
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: ./start.sh
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.10
      - key: GAIRUS_NAME
        value: Gaïrus
      - key: GAIRUS_AUTONOMY
        value: "true"
      - key: GAIRUS_APPROVALS
        value: "true"
      - key: GAIRUS_LLM_PROVIDER
        value: openrouter
      - key: GAIRUS_LLM_MODEL
        value: openrouter/free
