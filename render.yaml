services:
  - type: web
    name: gairus
    runtime: docker
    repo: https://github.com/zyrvion/Gairus-
    branch: repair/cloud-hardening-20261025
    dockerfilePath: ./Dockerfile
    dockerContext: .
    region: frankfurt
    plan: 0.5c-512mb
    numInstances: 1
    autoDeployTrigger: "off"
    healthCheckPath: /healthz
    disk:
      name: gairus-data
      mountPath: /app/data
      sizeGB: 1
    envVars:
      - key: GAIRUS_NAME
        value: Gaïrus
      - key: GAIRUS_DATA_DIR
        value: /app/data
      - key: GAIRUS_DB
        value: /app/data/gairus.db
      - key: GAIRUS_SLACK_MEMORY_DB
        value: /app/data/slack_memory.db
      - key: GAIRUS_AUTONOMY
        value: "false"
      - key: GAIRUS_APPROVALS
        value: "true"
      - key: GAIRUS_LLM_PROVIDER
        value: auto
      - key: GAIRUS_LLM_MODEL
        value: auto
      - key: GAIRUS_FREE_ONLY
        value: "true"
      - key: GAIRUS_ADMIN_KEY
        generateValue: true
      - key: GAIRUS_ORTA_API_KEY
        generateValue: true
      - key: GAIRUS_ALLOWED_ORIGINS
        value: https://gairus.zyrvion.io
